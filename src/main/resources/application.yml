server:
  port: 8081 # Running port of the inventory (product) service

# Product spec documents (.md) and the Bedrock knowledge base that indexes them.
#
# Credentials are deliberately absent: they come from the AWS default provider
# chain (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION, profiles, or an
# instance role), exactly as DeviceLK-AIRetrieval resolves them. Nothing here is
# a secret, so this block is safe to commit.
#
# Note the knowledge base only sees a document after an ingestion job runs —
# writing to the bucket alone does NOT make it answerable.
app:
  documents:
    # Empty defaults, not absent defaults: these name AWS resources that no
    # sensible fallback value can stand in for, so a developer without a .env
    # should still get a service that starts and fails at the point of an actual
    # document call, rather than one that cannot boot at all.
    bucket: ${DOCUMENTS_BUCKET:}
    knowledge-base-id: ${BEDROCK_KNOWLEDGE_BASE_ID:}
    data-source-id: ${BEDROCK_DATA_SOURCE_ID:}
    region: ${BEDROCK_REGION:us-east-1}

grpc:
  server:
    port: 9090
    reflection-service-enabled: true

spring:
  config:
    # Loads this service's own .env as a property source. The path is relative to
    # the process working directory, so it resolves for `mvn spring-boot:run` and
    # for `java -jar target/*.jar` as long as both are started from this service
    # directory (which is what the VS Code task's `cwd` guarantees).
    #
    # 'optional:' is what lets a service with no .env start normally instead of
    # failing on a missing import. The file is parsed as .properties, NOT as a
    # shell script: `export FOO=bar` would yield a key literally named
    # "export FOO", quotes are kept as part of the value, and a bare line with no
    # '=' becomes a key bound to the empty string, which silently BEATS any
    # ${VAR:default} in this file. Keep it to plain KEY=value lines.
    import: optional:file:./.env[.properties]
  application:
    # Registered in Eureka as PRODUCT-SERVICE — matches the API Gateway route (lb://PRODUCT-SERVICE)
    name: devicelk-inventory-service

  servlet:
    multipart:
      # The ONLY size check on a spec-document upload. The service performs none
      # of its own: two limits with the same default is a trap where the lower
      # wins silently and raising one appears to do nothing.
      #
      # 5MB is a guard against abuse rather than a real constraint — the largest
      # existing spec sheet is 2.4KB. max-request-size sits above max-file-size so
      # the multipart envelope around a maximum-size file does not trip the
      # request limit first and report the wrong problem.
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    # Host port 5433 maps to the devicelk-postgres container (docker-compose.yml).
    # This service's OWN database: it contains the inventory schema and nothing
    # else. Cart and order data live in devicelk_commerce, a separate database on
    # the same dev container, reachable only by DeviceLK-Commerce — there is no
    # connection from here to there, and no query that could span them.
    #
    # These read POSTGRES_USER / POSTGRES_PASSWORD rather than DB_USERNAME /
    # DB_PASSWORD on purpose. The .env beside this project is consumed by TWO
    # readers — this application, and docker-compose.yml, which creates the very
    # container these credentials authenticate against. Compose dictates the
    # names (POSTGRES_USER/POSTGRES_PASSWORD are what the postgres image takes),
    # so reading the same keys here keeps one credential in one place. Defining a
    # second DB_USERNAME alias alongside it would work right up until someone
    # changes the password on one line and not the other.
    #
    # NOTE: DeviceLK-Commerce still reads ${DB_USERNAME}/${DB_PASSWORD}. Its
    # defaults make it start regardless, but the two services do not share a
    # variable-naming convention — worth aligning deliberately, not by accident.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/devicelk_inventory}
    username: ${POSTGRES_USER:devicelk_admin}
    password: ${POSTGRES_PASSWORD:devicelk_pass}
    driver-class-name: org.postgresql.Driver

  flyway:
    # Flyway is the single source of truth for the schema. It runs before Hibernate on
    # startup, so a brand-new empty Postgres is brought up to the exact current schema
    # from db/migration/V1__baseline.sql automatically.
    #
    # WHY baseline-on-migrate + baseline-version=1 — the split-brain reality:
    #   * The existing hand-built dev DB (and any copy of it) already HAS the full
    #     schema but no flyway_schema_history table. baseline-on-migrate tells Flyway
    #     to adopt such a non-empty DB by writing a baseline row at version 1 instead
    #     of running V1 — so V1 never re-runs and never drops or recreates live data.
    #   * A fresh empty DB has no schema, so Flyway simply runs V1 from scratch.
    # One migration set therefore serves both worlds: adopt-in-place vs build-from-zero.
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Flyway is now the sole schema authority, so Hibernate checks rather than
      # builds. 'update' was the right setting while the schema was hand-built and
      # evolving; keeping it past that point means Hibernate can silently add a
      # column no migration describes, and the drift is only discovered on the
      # first database where ddl-auto was never allowed to run — production.
      # 'validate' turns that into a startup failure here instead.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          # Same Keycloak realm the API gateway already validates against, so a
          # token minted for the gateway is accepted here unchanged.
          #
          # Both properties are set on purpose. With jwk-set-uri present, Spring
          # builds the decoder lazily and fetches the keys on first use, so this
          # application still starts when Keycloak is down — setting issuer-uri
          # alone would make it fetch realm metadata during startup and fail.
          # issuer-uri is still honoured: it adds validation of the token's 'iss'
          # claim, so a correctly-signed token from another realm is rejected.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/devicelk}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/devicelk/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
