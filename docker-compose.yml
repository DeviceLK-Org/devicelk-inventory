# ---------------------------------------------------------------------------
# DeviceLK — Commerce modular monolith local infrastructure
# Spins up a PostgreSQL 16 instance for the commerce database, shared by the
# inventory / cart / orders modules (one schema per module, see ./init).
#
# Credentials are read from ./.env — copy .env.example to .env first.
#
# Usage:
#   docker compose up -d      # start the database in the background
#   docker compose down       # stop the container (data is preserved)
#   docker compose down -v    # stop and DELETE the data volume
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16
    container_name: devicelk-commerce-db
    restart: unless-stopped
    environment:
      # POSTGRES_DB makes the container create the 'devicelk_commerce'
      # database automatically on first startup.
      POSTGRES_DB: devicelk_commerce
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # host:container — exposes the database on localhost:5433
      - "5433:5432"
    volumes:
      # Named volume → data survives container restarts and recreations
      - devicelk_commerce_data:/var/lib/postgresql/data
      # Init scripts run ONLY on the first startup with an empty volume;
      # after changing them, recreate with `docker compose down -v && docker compose up -d`.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d devicelk_commerce"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  devicelk_commerce_data:
    name: devicelk_commerce_data
